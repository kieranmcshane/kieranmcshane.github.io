name: Refresh ratings and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A newer publication contains every earlier commit. Do not let an obsolete
  # sports refresh hold the Pages queue for the current site revision.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
      - name: Set cache date
        id: cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/rating-lab
          key: rating-lab-public-data-v4-${{ runner.os }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            rating-lab-public-data-v4-${{ runner.os }}-
            rating-lab-public-data-v3-${{ runner.os }}-
      - name: Restore last validated public snapshot
        uses: actions/cache@v4
        with:
          path: .cache/rating-lab-output
          key: rating-lab-valid-output-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rating-lab-valid-output-v1-${{ runner.os }}-
      - name: Seed fallback from last validated snapshot
        run: |
          if [ -d ".cache/rating-lab-output" ]; then
            cp -R ".cache/rating-lab-output/." "assets/data/rating-lab/"
          fi
      - name: Install archive reader
        if: github.event_name != 'push'
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - name: Install rating pipeline dependencies
        if: github.event_name != 'push'
        run: python -m pip install --requirement requirements-rating-lab.txt
      - name: Refresh public ratings
        if: github.event_name != 'push'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          RATING_LAB_CACHE_DIR: .cache/rating-lab
        run: |
          python scripts/refresh_ratings.py --sports tennis football national-football chess
      - name: Preserve validated public snapshot
        run: |
          mkdir -p .cache/rating-lab-output
          cp -R assets/data/rating-lab/. .cache/rating-lab-output/
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
