<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">The Galois correspondence for a biquadratic extension</title>
  <desc id="desc">The subgroup diamond of the Klein four-group is shown beside the reversed field diamond for Q adjoin square root 2 and square root 3.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .edge { stroke: #64748b; stroke-width: 2.5; }
    .node { fill: #ffffff; stroke: #0f766e; stroke-width: 2.5; rx: 12; }
    .field { stroke: #7c3aed; }
    .label { fill: #0f172a; font: 19px Georgia, serif; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; }
    .heading { fill: #0f172a; font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    .arrow { fill: #475569; font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
  </style>
  <rect class="bg" width="1040" height="520" rx="18"/>

  <text class="heading" x="260" y="42">Subgroups of V₄</text>
  <text class="heading" x="780" y="42">Intermediate fields</text>

  <line class="edge" x1="260" y1="112" x2="115" y2="255"/>
  <line class="edge" x1="260" y1="112" x2="260" y2="255"/>
  <line class="edge" x1="260" y1="112" x2="405" y2="255"/>
  <line class="edge" x1="115" y1="295" x2="260" y2="420"/>
  <line class="edge" x1="260" y1="295" x2="260" y2="420"/>
  <line class="edge" x1="405" y1="295" x2="260" y2="420"/>

  <rect class="node" x="205" y="78" width="110" height="48"/>
  <text class="label" x="260" y="102">{1}</text>
  <rect class="node" x="44" y="250" width="142" height="50"/>
  <text class="label small" x="115" y="275">⟨σ⟩</text>
  <rect class="node" x="189" y="250" width="142" height="50"/>
  <text class="label small" x="260" y="275">⟨τ⟩</text>
  <rect class="node" x="334" y="250" width="142" height="50"/>
  <text class="label small" x="405" y="275">⟨στ⟩</text>
  <rect class="node" x="205" y="405" width="110" height="48"/>
  <text class="label" x="260" y="429">V₄</text>

  <line class="edge" x1="780" y1="112" x2="615" y2="255"/>
  <line class="edge" x1="780" y1="112" x2="780" y2="255"/>
  <line class="edge" x1="780" y1="112" x2="945" y2="255"/>
  <line class="edge" x1="615" y1="305" x2="780" y2="420"/>
  <line class="edge" x1="780" y1="305" x2="780" y2="420"/>
  <line class="edge" x1="945" y1="305" x2="780" y2="420"/>

  <rect class="node field" x="644" y="78" width="272" height="48"/>
  <text class="label small" x="780" y="102">ℚ(√2, √3)</text>
  <rect class="node field" x="538" y="250" width="154" height="56"/>
  <text class="label small" x="615" y="278">ℚ(√3)</text>
  <rect class="node field" x="703" y="250" width="154" height="56"/>
  <text class="label small" x="780" y="278">ℚ(√2)</text>
  <rect class="node field" x="868" y="250" width="154" height="56"/>
  <text class="label small" x="945" y="278">ℚ(√6)</text>
  <rect class="node field" x="725" y="405" width="110" height="48"/>
  <text class="label" x="780" y="429">ℚ</text>

  <text class="arrow" x="520" y="190">fixed field →</text>
</svg>
