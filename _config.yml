title: "Kieran McShane: Notes"
description: "Research notes, mathematical writing, and interactive resources."
lang: en
author: Kieran McShane
url: "https://kieranmcshane.github.io"
baseurl: ""
image: /assets/images/og-default.png
mat101_image: /assets/images/og-mat101.png
twitter:
  card: summary_large_image
defaults:
  - scope:
      path: "mat101"
      type: "pages"
    values:
      image: /assets/images/og-mat101.png
      image_alt: "MAT101 — IMA02"
  - scope:
      type: "mat101_sessions"
    values:
      image: /assets/images/og-mat101.png
      image_alt: "MAT101 — IMA02"
  - scope:
      path: "mat101-sessions.md"
      type: "pages"
    values:
      image: /assets/images/og-mat101.png
      image_alt: "MAT101 — IMA02"
  - scope:
      path: "mat101-exercises.md"
      type: "pages"
    values:
      image: /assets/images/og-mat101.png
      image_alt: "MAT101 — IMA02"
  # jekyll-sitemap lists static HTML. Keep the deck out of sitemap.xml
  # without adding front matter to JIQ2026/index.html.
  - scope:
      path: "JIQ2026"
    values:
      sitemap: false
theme: minima
markdown: kramdown
permalink: /:year/:month/:day/:title/
show_excerpts: true
header_pages:
  - mat101-sessions.md
  - repertoire-raisonne.md
  - rating-lab.md
  - about.md
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
# GitHub Pages loads jekyll-optional-front-matter by default. That plugin
# turns Markdown without front matter into a themed page. JIQ2026.md is
# Marp source and must be copied unchanged, same as JIQ2026/index.html.
optional_front_matter: false
collections:
  mat101_sessions:
    output: true
    permalink: /mat101/seances/:name/

# Public MAT101 corrigés. Set to true to restore inline solutions,
# download links, and the copy that announces them. Solution data and
# assets stay in the repository either way.
mat101_show_solutions: false
# OAuth app client id (device flow) for editor-only full corrigé access on /mat101/exercices/.
# Set the repository secret MAT101_GITHUB_OAUTH_CLIENT_ID for GitHub Pages builds.
mat101_github_oauth_client_id: ""
mat101_owner_github_logins:
  - kieranmcshane
